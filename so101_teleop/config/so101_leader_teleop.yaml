# Parameters for the LeaderTeleopComponent
leader_teleop_component:
  ros__parameters:
    leader_joint_states_topic: "/leader/joint_states"
    follower_arm_trajectory_topic: "/follower/arm_controller/joint_trajectory"
    follower_gripper_command_topic: "/follower/gripper_controller/gripper_cmd"
    gripper_deadband: 0.01 # In radians
    arm_deadband: 0.002 # Radians; suppress stationary encoder quantization
    arm_filter_alpha: 0.35 # EMA at the 50 Hz leader state rate (~46 ms time constant)
    arm_publish_rate: 25.0 # Hz
    arm_trajectory_duration: 0.08 # Seconds
